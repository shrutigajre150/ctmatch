services:
  db:
    # Postgres 16 with pgvector preinstalled; the vector extension is used from v0.3 (embeddings).
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ctmatch
      POSTGRES_PASSWORD: ctmatch
      POSTGRES_DB: ctmatch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, on first start with an empty volume.
      - ./src/ctmatch/db/schema.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ctmatch -d ctmatch"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      CTMATCH_DATABASE_URL: postgresql://ctmatch:ctmatch@db:5432/ctmatch
    volumes:
      - ./data:/app/data
    # Default: a small smoke-test ingestion. Override with `docker compose run app ...`.
    command: ["python", "-m", "ctmatch.flows.ingest_trials", "--query", "type 2 diabetes", "--max-pages", "1"]

volumes:
  pgdata:
