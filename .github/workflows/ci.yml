name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Type check
        run: mypy
      - name: Unit tests
        run: pytest --cov=ctmatch --cov-report=term-missing --cov-fail-under=80

  integration:
    runs-on: ubuntu-latest
    needs: lint-type-test
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ctmatch
          POSTGRES_PASSWORD: ctmatch
          POSTGRES_DB: ctmatch
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ctmatch"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      CTMATCH_DATABASE_URL: postgresql://ctmatch:ctmatch@localhost:5432/ctmatch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Integration tests
        run: pytest -m integration
