[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ctmatch"
version = "0.1.0"
description = "Clinical Trial Matching & Intelligence Platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Shruti Gajre" }]
dependencies = [
    "pydantic>=2.7",
    "requests>=2.32",
    "psycopg[binary]>=3.2",
    "prefect>=3.0,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-requests",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ctmatch"]  # includes db/schema.sql

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: needs a running Postgres (set CTMATCH_DATABASE_URL)",
]
addopts = "-ra --strict-markers -m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["ctmatch"]

[[tool.mypy.overrides]]
module = ["prefect.*", "psycopg.*"]
ignore_missing_imports = true

# Prefect's decorators are typed, but keep mypy usable where Prefect isn't installed.
[[tool.mypy.overrides]]
module = ["ctmatch.flows.*"]
disallow_untyped_decorators = false

[tool.coverage.run]
source = ["ctmatch"]
# Orchestration and DB code are exercised by the integration job (real Postgres), not unit tests.
omit = ["*/ctmatch/flows/*", "*/ctmatch/db/*"]
